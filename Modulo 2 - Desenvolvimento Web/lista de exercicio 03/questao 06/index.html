<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria</title>
    <link rel="stylesheet" href="style.css">
    <!-- 6. Exercício Grid e Flexbox - Monte uma galeria com oito imagens e legendas,
organizadas por Grid. Além disso, envolva toda a galeria em um contêiner que
utilize Flexbox para centralizar o conjunto na página e permitir que as figuras
quebrem de linha quando a largura for limitada. Ajuste o número de colunas do
Grid para telas menores por meio de media query. -->
</head>
<body>
    <h1>Filmes em Catálogo</h1>
    <div class="container">
        <div class="galeria">
            <figure>
                <img src="./assets/chainsaw.webp" alt="chainsaw">
                <figcaption>Chainsaw Man</figcaption>
            </figure>
            <figure>
                <img src="./assets/mauriciodesouza.webp" alt="Maurício de Souza">
                <figcaption>Maurício de Souza</figcaption>
            </figure>
            <figure>
                <img src="./assets/natalPatrulha.webp" alt="Natal da Patrulha Canina">
                <figcaption>O Natal da Patrulha Canina</figcaption>
            </figure>
            <figure>
                <img src="./assets/noivaCadaver.webp" alt="Noiva Cadáver">
                <figcaption>A Noiva Cadáver (Relançamento)</figcaption>
            </figure>
            <figure>
                <img src="./assets/seNaoFosseVoce.webp" alt="Se Não Fosse Você">
                <figcaption>Se Não Fosse Você</figcaption>
            </figure>
            <figure>
                <img src="./assets/springsteen.webp" alt="springsteen">
                <figcaption>Springsteen: Salve-me Do Desconhecido
</figcaption>
            </figure>
            <figure>
                <img src="./assets/telefonepreto2.webp" alt="Telefone Preto 2">
                <figcaption>Telefone Preto 2</figcaption>
            </figure>
            <figure>
                <img src="./assets/tubarao.webp" alt="Tubarão">
                <figcaption>Tubarão (Relançamento)</figcaption>
            </figure>
        </div>
    </div> 
</body>
</html>
